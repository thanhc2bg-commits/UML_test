<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn tập Use Case Diagram</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Nạp Supabase qua CDN, ghim phiên bản -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4/dist/umd/supabase.min.js"></script>
</head>
<body>
    <nav id="navbar" style="display: none;">
        <div class="nav-brand">Ôn tập UML</div>
        <div class="nav-user">
            <span id="user-name"></span>
            <button id="btn-logout">Đăng xuất</button>
        </div>
    </nav>

    <main id="app">
        <!-- Trang Đăng nhập -->
        <section id="view-login" class="view">
            <div class="login-container">
                <h2>Đăng nhập</h2>
                <div id="login-error" class="error-msg" style="display: none;"></div>
                <form id="form-login">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label>Mật khẩu</label>
                        <input type="password" id="password" required>
                    </div>
                    <button type="submit" id="btn-login">Đăng nhập</button>
                </form>
            </div>
        </section>

        <!-- Trang Home (dành cho student) -->
        <section id="view-home" class="view" style="display: none;">
            <h2>Trang chủ (Học sinh)</h2>
            <p>Khung nội dung Giai đoạn 2. Sẽ cập nhật phần ôn tập ở Giai đoạn 3.</p>
        </section>

        <!-- Trang Admin -->
        <section id="view-admin" class="view" style="display: none;">
            <h2>Trang quản trị (Admin)</h2>
            <p>Khung nội dung Giai đoạn 2. Sẽ cập nhật bảng tổng hợp ở Giai đoạn 5.</p>
        </section>
    </main>

    <!-- Nạp các file JS -->
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
